[project]
name = "roomset-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pillow>=10.4",
  "numpy>=1.26,<3",
  "trimesh>=4.4,<5",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
modal = ["modal>=1.6.3,<2"]
dev = ["pytest>=8", "ruff>=0.6", "qrcode>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/db/migrations/versions/*" = ["E501"]
